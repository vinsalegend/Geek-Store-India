<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geek Store India - Shop | All India Delivery</title>
<meta name="description" content="Geek Store India - Shop. Order massagers and more, delivered all over India. Based in Theni, Tamil Nadu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1447e6;
    --blue-dark:#0a2f9e;
    --blue-light:#eaf0ff;
    --black:#0b0d12;
    --white:#ffffff;
    --grey:#6b7280;
    --grey-light:#f4f5f7;
    --border:#e5e7eb;
    --success:#16a34a;
    --whatsapp:#25D366;
    --radius:14px;
    --shadow: 0 2px 10px rgba(11,13,18,0.06);
    --shadow-lg: 0 12px 32px rgba(11,13,18,0.16);
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--white);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    padding-bottom:90px;
  }
  h1,h2,h3,.brand,.price,.btn{font-family:'Space Grotesk',system-ui,sans-serif;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  /* ===== HEADER ===== */
  header.site-header{
    position:sticky;top:0;z-index:40;
    background:var(--black);
    color:var(--white);
    padding:16px 18px 18px;
    box-shadow:var(--shadow);
  }
  .header-inner{max-width:1100px;margin:0 auto;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--blue),#4d7bff);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;color:var(--white);
    flex-shrink:0;
  }
  .brand{font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;}
  .tagline{font-size:12.5px;color:#9fb3ff;margin-top:2px;font-weight:500;}
  .header-meta{
    display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;
    font-size:12.5px;color:#c7cede;
  }
  .header-meta span{display:flex;align-items:center;gap:5px;}

  /* ===== CATEGORY FILTER ===== */
  .filter-bar{
    position:sticky;top:88px;z-index:35;
    background:var(--white);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    display:flex;gap:8px;overflow-x:auto;
    scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--border);
    font-size:13.5px;font-weight:600;
    color:var(--black);
    background:var(--white);
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--blue);
    border-color:var(--blue);
    color:var(--white);
  }

  /* ===== PRODUCT GRID ===== */
  main{max-width:1100px;margin:0 auto;padding:18px 16px 40px;}
  .section-title{
    font-size:15px;font-weight:700;color:var(--grey);
    text-transform:uppercase;letter-spacing:.06em;
    margin:6px 2px 14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px;}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .card-img-wrap{
    position:relative;
    aspect-ratio:1/1;
    background:var(--grey-light);
    overflow:hidden;
  }
  .card-img-wrap img{width:100%;height:100%;object-fit:cover;}
  .badge{
    position:absolute;top:8px;left:8px;
    background:var(--black);color:var(--white);
    font-size:10px;font-weight:700;letter-spacing:.03em;
    padding:4px 8px;border-radius:6px;
    text-transform:uppercase;
  }
  .card-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-cat{font-size:11px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .card-name{font-size:14.5px;font-weight:600;line-height:1.3;min-height:38px;}
  .price{font-size:17px;font-weight:700;color:var(--black);margin-top:2px;}
  .btn-row{display:flex;gap:8px;margin-top:auto;}
  .add-btn{
    flex:1;
    background:var(--blue);
    color:var(--white);
    font-weight:700;
    font-size:13px;
    padding:10px 8px;
    border-radius:9px;
    text-align:center;
    transition:background .15s ease, transform .1s ease;
  }
  .add-btn:active{transform:scale(.96);}
  .add-btn.added{background:var(--success);}
  .buy-btn{
    flex:1;
    background:var(--white);
    color:var(--blue);
    border:1.5px solid var(--blue);
    font-weight:700;
    font-size:13px;
    padding:10px 8px;
    border-radius:9px;
    text-align:center;
    transition:background .15s ease, transform .1s ease;
  }
  .buy-btn:active{transform:scale(.96);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--grey);
  }

  /* ===== STICKY CART BUTTON ===== */
  .cart-fab{
    position:fixed;right:18px;bottom:18px;z-index:50;
    background:var(--blue);color:var(--white);
    width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-lg);
    transition:transform .15s ease;
  }
  .cart-fab:active{transform:scale(.92);}
  .cart-fab svg{width:26px;height:26px;}
  .cart-count{
    position:absolute;top:-4px;right:-4px;
    background:var(--black);color:var(--white);
    font-size:11px;font-weight:700;
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--white);
  }
  .cart-count.pulse{animation:pulse .35s ease;}
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}

  /* ===== WHATSAPP FAB ===== */
  .wa-fab{
    position:fixed;left:18px;bottom:18px;z-index:50;
    background:var(--whatsapp);color:var(--white);
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-lg);
  }
  .wa-fab svg{width:28px;height:28px;}

  /* ===== MODAL / DRAWER ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(11,13,18,.5);
    z-index:60;opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;right:0;top:0;bottom:0;z-index:61;
    width:100%;max-width:420px;background:var(--white);
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-header{
    padding:18px 18px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .drawer-header h2{font-size:18px;font-weight:700;}
  .close-btn{
    width:34px;height:34px;border-radius:50%;
    background:var(--grey-light);display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--black);
  }
  .drawer-body{flex:1;overflow-y:auto;padding:14px 18px;}
  .drawer-footer{
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    background:var(--white);
  }

  .cart-item{
    display:flex;gap:12px;padding:14px 0;
    border-bottom:1px solid var(--border);
  }
  .cart-item img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--grey-light);flex-shrink:0;}
  .ci-info{flex:1;display:flex;flex-direction:column;gap:4px;}
  .ci-name{font-size:14px;font-weight:600;line-height:1.3;}
  .ci-price{font-size:12.5px;color:var(--grey);}
  .ci-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .qty-control{
    display:flex;align-items:center;gap:0;
    border:1.5px solid var(--border);border-radius:8px;overflow:hidden;
  }
  .qty-control button{
    width:28px;height:28px;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    background:var(--grey-light);color:var(--black);
  }
  .qty-control span{width:28px;text-align:center;font-size:13.5px;font-weight:600;}
  .ci-sub{font-size:14px;font-weight:700;}
  .remove-btn{
    font-size:11.5px;color:#dc2626;font-weight:600;margin-top:6px;
  }

  .cart-empty{text-align:center;padding:50px 10px;color:var(--grey);}
  .cart-empty svg{width:56px;height:56px;color:var(--border);margin-bottom:10px;}

  .total-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:4px;color:var(--grey);}
  .grand-row{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;margin:8px 0 14px;}
  .place-order-btn{
    width:100%;background:var(--blue);color:var(--white);
    font-size:15px;font-weight:700;padding:14px;border-radius:10px;
    text-align:center;transition:background .15s;
  }
  .place-order-btn:disabled{background:var(--border);color:var(--grey);}

  /* ===== CHECKOUT FORM DRAWER ===== */
  .form-group{margin-bottom:14px;}
  .form-group label{
    display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--black);
  }
  .form-group label .req{color:#dc2626;}
  .form-group input, .form-group textarea{
    width:100%;padding:12px 13px;border:1.5px solid var(--border);
    border-radius:9px;font-size:14.5px;font-family:inherit;
    background:var(--grey-light);
  }
  .form-group input:focus, .form-group textarea:focus{
    outline:none;border-color:var(--blue);background:var(--white);
  }
  .form-group textarea{resize:vertical;min-height:70px;}
  .order-summary-mini{
    background:var(--blue-light);border-radius:10px;padding:12px 14px;
    font-size:13px;margin-bottom:16px;
  }
  .order-summary-mini div{display:flex;justify-content:space-between;padding:3px 0;}
  .order-summary-mini .total-line{font-weight:700;border-top:1px dashed #b9caff;margin-top:6px;padding-top:8px;}

  /* ===== CONFIRMATION ===== */
  .confirm-box{
    text-align:center;padding:20px 6px;
  }
  .confirm-icon{
    width:64px;height:64px;border-radius:50%;background:#dcfce7;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .confirm-icon svg{width:32px;height:32px;color:var(--success);}
  .confirm-box h3{font-size:18px;margin-bottom:8px;}
  .confirm-box p{font-size:13.5px;color:var(--grey);line-height:1.5;margin-bottom:18px;}
  .wa-confirm-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--whatsapp);color:var(--white);
    font-weight:700;font-size:14px;padding:12px 22px;border-radius:10px;
  }
  .wa-confirm-btn svg{width:18px;height:18px;}

  footer{
    text-align:center;padding:26px 16px;color:var(--grey);font-size:12px;
    border-top:1px solid var(--border);margin-top:20px;
  }
  footer .fname{font-weight:700;color:var(--black);}

  .spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
    border-top-color:var(--white);border-radius:50%;
    animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<a class="wa-fab" href="https://wa.me/917737921660" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.29-1.39a9.9 9.9 0 0 0 4.7 1.2h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.09c-.24.68-1.4 1.3-1.93 1.37-.5.08-1.12.11-1.81-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.83 2 .9 2.15.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.93 1.23 2.21 1.37.28.14.44.12.6-.07.17-.19.71-.83.9-1.11.19-.29.38-.24.63-.14.26.09 1.64.77 1.92.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>

<!-- Cart floating button -->
<button class="cart-fab" id="cartFab" aria-label="Open cart">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>

<footer>
  <span class="fname">Geek Store India - Shop</span> · Theni, Tamil Nadu<br>
  Order collection only — we'll confirm your order on WhatsApp before delivery.

<script>
(function(){
  "use strict";

  /* ================= CONFIG ================= */
  const SHOP = {
    name: "Geek Store India - Shop",
    tagline: "All India Delivery 🚚",
    location: "Theni, Tamil Nadu",
    phone: "7737921660",
    whatsapp: "917737921660",
    email: "asmrsmoothedge@gmail.com",
    formspreeAction: "https://formspree.io/f/xljrrqew"
  };

  const PRODUCTS = [
    {
      id: "p1",
      name: "Neck and Shoulder Massager 4D",
      price: 1499,
      category: "Massager",
      img: "https://i.ibb.co/PsMgHyRY/IMG-20260804-WA0021.jpg",
      badge: "PREMIUM Imported Massager"
    }
  ];

  const CATEGORIES = ["All", ...Array.from(new Set(PRODUCTS.map(p => p.category)))];

  const money = n => "₹" + Number(n).toLocaleString("en-IN");

  /* ================= STATE ================= */
  let cart = JSON.parse(localStorage.getItem("gsi_cart") || "{}"); // {productId: qty}
  let activeCategory = "All";

  function saveCart(){
    localStorage.setItem("gsi_cart", JSON.stringify(cart));
    renderCartBadge();
  }

  function cartItemCount(){
    return Object.values(cart).reduce((a,b) => a+b, 0);
  }

  function cartItems(){
    return Object.entries(cart)
      .map(([id, qty]) => ({ product: PRODUCTS.find(p => p.id === id), qty }))
      .filter(i => i.product && i.qty > 0);
  }

  function cartTotal(){
    return cartItems().reduce((sum, i) => sum + i.product.price * i.qty, 0);
  }

  /* ================= RENDER: FILTER BAR ================= */
  const filterBar = document.getElementById("filterBar");
  function renderFilterBar(){
    filterBar.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "chip" + (cat === activeCategory ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        activeCategory = cat;
        renderFilterBar();
        renderGrid();
      });
      filterBar.appendChild(btn);
    });
  }

  /* ================= RENDER: PRODUCT GRID ================= */
  const grid = document.getElementById("productGrid");
  const sectionTitle = document.getElementById("sectionTitle");

  function renderGrid(){
    const list = activeCategory === "All" ? PRODUCTS : PRODUCTS.filter(p => p.category === activeCategory);
    sectionTitle.textContent = activeCategory === "All" ? "All Products" : activeCategory;
    grid.innerHTML = "";

    if(list.length === 0){
      grid.innerHTML = '<div class="empty-state">No products in this category yet.</div>';
      return;
    }

    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-img-wrap">
          ${p.badge ? `<span class="badge">${escapeHtml(p.badge)}</span>` : ""}
          <img src="${p.img}" alt="${escapeHtml(p.name)}" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-cat">${escapeHtml(p.category)}</div>
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="price">${money(p.price)}</div>
          <div class="btn-row">
            <button class="add-btn" data-id="${p.id}">Add to Cart</button>
            <button class="buy-btn" data-id="${p.id}">Buy Now</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.querySelectorAll(".add-btn").forEach(btn => {
      btn.addEventListener("click", () => addToCart(btn.dataset.id, btn));
    });
    grid.querySelectorAll(".buy-btn").forEach(btn => {
      btn.addEventListener("click", () => buyNow(btn.dataset.id));
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[s]));
  }

  function addToCart(id, btnEl){
    cart[id] = (cart[id] || 0) + 1;
    saveCart();
    pulseCartIcon();
    if(btnEl){
      const original = btnEl.textContent;
      btnEl.textContent = "Added ✓";
      btnEl.classList.add("added");
      setTimeout(() => {
        btnEl.textContent = original;
        btnEl.classList.remove("added");
      }, 900);
    }
  }

  function buyNow(id){
    if(!cart[id]) cart[id] = 1;
    saveCart();
    renderCheckoutForm();
    closeAllDrawers();
    openDrawer(checkoutDrawer);
  }

  /* ================= CART BADGE ================= */
  const cartCountEl = document.getElementById("cartCount");
  function renderCartBadge(){
    const count = cartItemCount();
    if(count > 0){
      cartCountEl.style.display = "flex";
      cartCountEl.textContent = count;
    } else {
      cartCountEl.style.display = "none";
    }
  }
  function pulseCartIcon(){
    cartCountEl.classList.remove("pulse");
    void cartCountEl.offsetWidth;
    cartCountEl.classList.add("pulse");
  }

  /* ================= DRAWERS ================= */
  const overlay = document.getElementById("overlay");
  const cartDrawer = document.getElementById("cartDrawer");
  const checkoutDrawer = document.getElementById("checkoutDrawer");
  const cartFab = document.getElementById("cartFab");
  const closeCart = document.getElementById("closeCart");
  const closeCheckout = document.getElementById("closeCheckout");

  function openDrawer(drawer){
    overlay.classList.add("open");
    drawer.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeAllDrawers(){
    overlay.classList.remove("open");
    cartDrawer.classList.remove("open");
    checkoutDrawer.classList.remove("open");
    document.body.style.overflow = "";
  }

  cartFab.addEventListener("click", () => { renderCart(); openDrawer(cartDrawer); });
  closeCart.addEventListener("click", closeAllDrawers);
  closeCheckout.addEventListener("click", closeAllDrawers);
  overlay.addEventListener("click", closeAllDrawers);

  /* ================= RENDER: CART ================= */
  const cartBody = document.getElementById("cartBody");
  const cartFooter = document.getElementById("cartFooter");

  function renderCart(){
    const items = cartItems();

    if(items.length === 0){
      cartBody.innerHTML = `
        <div class="cart-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <div>Your cart is empty</div>
        </div>`;
      cartFooter.innerHTML = "";
      return;
    }

    cartBody.innerHTML = "";
    items.forEach(({product, qty}) => {
      const row = document.createElement("div");
      row.className = "cart-item";
      row.innerHTML = `
        <img src="${product.img}" alt="${escapeHtml(product.name)}" loading="lazy">
        <div class="ci-info">
          <div class="ci-name">${escapeHtml(product.name)}</div>
          <div class="ci-price">${money(product.price)} each</div>
          <div class="ci-row">
            <div class="qty-control">
              <button class="qty-minus" data-id="${product.id}">−</button>
              <span>${qty}</span>
              <button class="qty-plus" data-id="${product.id}">+</button>
            </div>
            <div class="ci-sub">${money(product.price * qty)}</div>
          </div>
          <button class="remove-btn" data-id="${product.id}">Remove</button>
        </div>
      `;
      cartBody.appendChild(row);
    });

    cartBody.querySelectorAll(".qty-plus").forEach(b => b.addEventListener("click", () => {
      cart[b.dataset.id] = (cart[b.dataset.id]||0) + 1; saveCart(); renderCart();
    }));
    cartBody.querySelectorAll(".qty-minus").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.id;
      cart[id] = (cart[id]||0) - 1;
      if(cart[id] <= 0) delete cart[id];
      saveCart(); renderCart();
    }));
    cartBody.querySelectorAll(".remove-btn").forEach(b => b.addEventListener("click", () => {
      delete cart[b.dataset.id]; saveCart(); renderCart();
    }));

    const total = cartTotal();
    cartFooter.innerHTML = `
      <div class="grand-row"><span>Grand Total</span><span>${money(total)}</span></div>
      <button class="place-order-btn" id="placeOrderBtn">Place Order</button>
    `;
    document.getElementById("placeOrderBtn").addEventListener("click", () => {
      renderCheckoutForm();
      closeAllDrawers();
      openDrawer(checkoutDrawer);
    });
  }

  /* ================= CHECKOUT FORM ================= */
  const checkoutBody = document.getElementById("checkoutBody");

  function buildOrderSummaryText(){
    const items = cartItems();
    const lines = items.map(({product, qty}) =>
      `• ${product.name}  x${qty}  @ ${money(product.price)}  = ${money(product.price*qty)}`
    );
    return lines.join("\n") + `\n\nGRAND TOTAL: ${money(cartTotal())}`;
  }

  function renderCheckoutForm(){
    const items = cartItems();
    const total = cartTotal();

    const miniSummary = items.map(({product, qty}) => `
      <div><span>${escapeHtml(product.name)} x${qty}</span><span>${money(product.price*qty)}</span></div>
    `).join("");

    checkoutBody.innerHTML = `
      <div class="order-summary-mini">
        ${miniSummary}
        <div class="total-line"><span>Grand Total</span><span>${money(total)}</span></div>
      </div>

      <form id="orderForm" action="${SHOP.formspreeAction}" method="POST">
        <input type="hidden" name="_subject" value="New Order - ${SHOP.name}">
        <input type="hidden" name="Order Summary" id="hiddenOrderSummary">
        <input type="hidden" name="Grand Total" value="${money(total)}">
        <input type="hidden" name="Shop" value="${SHOP.name}">

        <div class="form-group">
          <label>Customer Name <span class="req">*</span></label>
          <input type="text" name="Customer Name" id="custName" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Phone Number <span class="req">*</span></label>
          <input type="tel" name="Phone Number" id="custPhone" required placeholder="10-digit mobile number"
            inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="Enter exactly 10 digits"
            oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
        </div>
        <div class="form-group">
          <label>Delivery Address <span class="req">*</span></label>
          <textarea name="Delivery Address" id="custAddress" required placeholder="House no, street, city, state, pincode"></textarea>
        </div>
        <div class="form-group">
          <label>Special Instructions (optional)</label>
          <textarea name="Special Instructions" id="custNotes" placeholder="Any delivery notes, color preference, etc."></textarea>
        </div>

        <button type="submit" class="place-order-btn" id="submitOrderBtn">Place Order</button>
      </form>
    `;

    const form = document.getElementById("orderForm");
    form.addEventListener("submit", handleOrderSubmit);
  }

  async function handleOrderSubmit(e){
    e.preventDefault();
    const form = e.target;
    const submitBtn = document.getElementById("submitOrderBtn");

    const items = cartItems();
    if(items.length === 0){
      alert("Your cart is empty.");
      return;
    }

    // Compile full readable order summary into the hidden field
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    const notes = document.getElementById("custNotes").value.trim();

    const fullSummary =
`ORDER FROM: ${SHOP.name}
-----------------------------
CUSTOMER DETAILS
Name: ${name}
Phone: ${phone}
Address: ${address}
Special Instructions: ${notes || "None"}

-----------------------------
ORDER ITEMS
${buildOrderSummaryText()}
-----------------------------`;

    document.getElementById("hiddenOrderSummary").value = fullSummary;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Placing Order...';

    try{
      const res = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      });

      if(res.ok){
        cart = {};
        saveCart();
        showConfirmation(name);
      } else {
        throw new Error("Submission failed");
      }
    } catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = "Place Order";
      alert("Something went wrong sending your order. Please try again, or contact us directly on WhatsApp.");
    }
  }

  function showConfirmation(name){
    checkoutBody.innerHTML = `
      <div class="confirm-box">
        <div class="confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h3>Order placed!</h3>
        <p>Thanks${name ? ", " + escapeHtml(name) : ""}! Geek Store India will contact you on WhatsApp to confirm your order, pricing and delivery.</p>
        <a class="wa-confirm-btn" href="https://wa.me/${SHOP.whatsapp}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.29-1.39a9.9 9.9 0 0 0 4.7 1.2h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.09c-.24.68-1.4 1.3-1.93 1.37-.5.08-1.12.11-1.81-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.83 2 .9 2.15.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.93 1.23 2.21 1.37.28.14.44.12.6-.07.17-.19.71-.83.9-1.11.19-.29.38-.24.63-.14.26.09 1.64.77 1.92.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
          Chat on WhatsApp
        </a>
      </div>
    `;
  }

  /* ================= INIT ================= */
  renderFilterBar();
  renderGrid();
  renderCartBadge();
})();
</script>
</body>
</html>
